name: Validation of Dublin Core compliance for MEI Files

on:
  push:
    branches: 
      - ftr/metadata-validation-and-generation
      - main
  pull_request:
    branches: 
      - ftr/metadata-validation-and-generation
      - main
  workflow_dispatch:

jobs:
  validate-schematron:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout current Repository
        uses: actions/checkout@v6
        with:
          ref: ftr/metadata-validation-and-generation

      - name: Checkout Tools Repository
        uses: actions/checkout@v6
        with:
          repository: Edirom/mei-metadata-toolkit
          ref: main
          path: mei-metadata-toolkit

      - name: Create necessary directories
        run: |
          mkdir -p .github/workflow-reports/validation
          echo "OUTPUT_DIR=.github/workflow-reports/validation" >> $GITHUB_ENV

      - name: Install Java and SchXslt
        run: |
          echo "Installing Java..."
          sudo apt-get update
          sudo apt-get install -y default-jre-headless
          
          echo "Downloading SchXslt..."
          wget -q https://codeberg.org/SchXslt/schxslt/releases/download/v1.10.1/schxslt-cli.jar
          
          # Verify the jar exists
          if [ ! -f "schxslt-cli.jar" ]; then
            echo "Error: SchXslt JAR not found after unzip."
            exit 1
          fi
          
          echo "SCHXSLT_JAR=$(pwd)/schxslt-cli.jar" >> $GITHUB_ENV
          echo "Java Version:"
          java -version

      - name: Find all XML files and validate against Schematron
        id: validation
        env:
          SCHEMATRON_FILE: "mei-metadata-toolkit/src/schema/mei-dc.sch"
          REPORT_FILE: ".github/workflow-reports/mei-dublin-core-validation.md"
        run: |

          grep -r -l -H --include \*.xml --exclude-dir=.github            "http://www.music-encoding.org/ns/mei" . \
            > xml_files.txt

          REPORT="$REPORT_FILE"
          
          # Initialize the report
          echo "### Schematron Validation Report" > "$REPORT"
          echo "Generated: $(date)" >> "$REPORT"
          echo "" >> "$REPORT"
          echo "Branch: ${{ github.ref_name }}" >> "$REPORT"
          echo "" >> "$REPORT"
          echo "Found $(wc -l < xml_files.txt) XML files to process." >> "$REPORT"
          echo "" >> "$REPORT"
          
          # Read the file list
          while IFS= read -r file; do
            [ -z "$file" ] && continue
            
            TOTAL_FILES=$((TOTAL_FILES + 1))
            echo "Processing file $TOTAL_FILES/$TOTAL_FILES: $file"
            
            echo "Validating: $file <br>" >> "$REPORT"
            
            # Verify the            schematron file exists
 if [            ! -f "$SCHEMATRON_FILE" ]; then
 echo "Error: Schematron file
            not found."
 exit 1
            fi

            output_file="$OUTPUT_DIR/$(basename "$file" .xml)-validation.xml"
            
            output=$(java -jar "$SCHXSLT_JAR" -d              "$file" -s              "$SCHEMATRON_FILE"            -o      "$output_file"            2>&1)            
            exit_code=$?
            set            -e
            
            if [ $exit_code -eq              0 ]; then
              echo "  ✅ Status: PASSED" >> "$REPORT"
              if grep -q "WARNING" "$output_file"; then
                echo " (with warnings) <br>" >> "$REPORT"
              else
                echo " <br>" >> "$REPORT"
              fi
              echo "Output file: $output_file <br>" >> "$REPORT"
              echo "" >> "$REPORT"
              PASSED_FILES=$((PASSED_FILES + 1))
            else
              ALL_SUCCESS=false
              echo "  ❌ Status: FAILED <br>" >> "$REPORT"
              echo "  --- Error Messages --- <br>" >> "$REPORT"
              # Print the error output
              echo "$output" >> "$REPORT"
              echo "" >> "$REPORT"
              FAILED_FILES=$((FAILED_FILES + 1))
            fi
          done < xml_files.txt
          echo "Dublin Core validation completed. Validation report files are located in $OUTPUT_DIR." >> "$REPORT"
          cat "$REPORT"

      - name: Upload Validation Report as Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mei-dc-validation-report
          path: .github/workflow-reports/mei-dc-validation_report.md

      - name: Commit and Push
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add .github/workflow-reports/mei-dublin-core-validation.md
          git add .github/workflow-reports/validation/*.xml
          git commit -m "Update Dublin Core validation report" || echo "No changes to commit"
          git pull --rebase
          git push
          # Note: The 'git push' step will fail in Pull Request workflows unless you use a specific token
       
